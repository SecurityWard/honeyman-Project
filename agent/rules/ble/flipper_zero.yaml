rule_id: ble_flipper_001
name: "Flipper Zero BLE Detection"
version: 2.0
enabled: true
severity: high
threat_type: flipper_zero
category: ble

# Detect Flipper Zero device
conditions:
  operator: OR
  clauses:
    # Flipper Zero advertises with "Flipper" in its BLE name. Dropped the
    # broad tokens that matched common consumer gear: "momentum" (Sennheiser
    # Momentum headphones), "\bRM\b" (a model prefix on many devices), and
    # "\bFZ\b" (too short). Custom-firmware variants (Unleashed/Xtreme/
    # RogueMaster/"FZ_") are handled by flipper_zero_unleashed.yaml.
    - type: file_pattern
      field: device_name
      operator: regex
      pattern: ".*[Ff]lipper.*"

    # Suspicious BLE service UUIDs
    - type: service_name
      field: service_uuid
      operator: in
      values:
        - "0000"  # Generic service
        - "fff0"  # Common Flipper service

    # Rapid device name changes
    - type: behavioral
      metric: name_change_rate
      operator: anomaly
      threshold: 5.0  # Changes per minute

actions:
  - type: alert_dashboard
    priority: high

  - type: local_log
    severity: high

metadata:
  references:
    - https://github.com/flipperdevices/flipperzero-firmware
  tags:
    - flipper_zero
    - ble
    - bluetooth_spam
  description: "Detects Flipper Zero devices via firmware signatures and behavioral patterns"

tuning:
  confidence_threshold: 0.90
  max_alerts_per_hour: 15
